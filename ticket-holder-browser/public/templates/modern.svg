<?xml version="1.0" encoding="UTF-8"?>
<!-- 现代简约风格车票模板 -->
<svg width="1011" height="638" viewBox="0 0 1011 638" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.08" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="1011" height="638" fill="url(#bgGradient)"/>
  <rect width="1011" height="638" fill="#ffffff" opacity="0.95"/>
  
  <!-- 顶部色条 -->
  <rect width="1011" height="8" fill="#667eea"/>
  
  <!-- 主内容区 -->
  <rect x="30" y="30" width="951" height="578" fill="white" rx="15" 
        style="filter: drop-shadow(0 2px 8px rgba(0,0,0,0.08))"/>
  
  <!-- 车次号背景 -->
  <circle cx="120" cy="120" r="60" fill="#667eea" opacity="0.1"/>
  
  <!-- 车次号 -->
  <text x="120" y="105" 
        font-family="Arial, Microsoft YaHei, sans-serif" 
        font-size="68" 
        font-weight="bold" 
        fill="#667eea" 
        text-anchor="middle">
    {{trainNumber}}
  </text>
  
  <!-- 业务标签 -->
  <text x="120" y="155" 
        font-family="Arial, Microsoft YaHei, sans-serif" 
        font-size="24" 
        font-weight="bold" 
        fill="#e91e63" 
        text-anchor="middle">
    {{businessTag}}
  </text>
  
  <!-- 分隔线 -->
  <line x1="50" y1="200" x2="961" y2="200" 
        stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- 车站信息区域背景 -->
  <rect x="50" y="220" width="650" height="140" fill="#f8f9fa" rx="10"/>
  
  <!-- 发站 -->
  <text x="80" y="260" 
        font-family="Arial, Microsoft YaHei, sans-serif" 
        font-size="52" 
        font-weight="bold" 
        fill="#212121">
    {{departureStation}}
  </text>
  
  <!-- 箭头 -->
  <text x="350" y="260" 
        font-family="Arial, sans-serif" 
        font-size="44" 
        fill="#9e9e9e">
    ➜
  </text>
  
  <!-- 到站 -->
  <text x="420" y="260" 
        font-family="Arial, Microsoft YaHei, sans-serif" 
        font-size="52" 
        font-weight="bold" 
        fill="#212121">
    {{destinationStation}}
  </text>
  
  <!-- 日期时间 -->
  <text x="80" y="320" 
        font-family="Arial, Microsoft YaHei, sans-serif" 
        font-size="32" 
        fill="#616161">
    📅 {{travelDate}} {{departureTime}}
  </text>
  
  <!-- 票价卡片 -->
  <rect x="730" y="220" width="210" height="140" fill="#fff8e1" 
        stroke="#ffa726" stroke-width="3" rx="12"/>
  
  <!-- 票价标签 -->
  <text x="835" y="250" 
        font-family="Arial, Microsoft YaHei, sans-serif" 
        font-size="24" 
        fill="#ef6c00" 
        text-anchor="middle">
    FARE
  </text>
  
  <!-- 票价 -->
  <text x="835" y="310" 
        font-family="Arial, Microsoft YaHei, sans-serif" 
        font-size="48" 
        font-weight="bold" 
        fill="#e65100" 
        text-anchor="middle">
    {{fareWithSymbol}}
  </text>
  
  <!-- 座位信息区 -->
  <rect x="50" y="390" width="910" height="80" fill="white" rx="8"
        stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- 座位图标和信息 -->
  <text x="80" y="430" 
        font-family="Arial, Microsoft YaHei, sans-serif" 
        font-size="36" 
        fill="#424242">
    🚃 {{seatInfo}}
  </text>
  
  <!-- 乘客信息 -->
  <text x="80" y="510" 
        font-family="Arial, Microsoft YaHei, sans-serif" 
        font-size="28" 
        fill="#616161">
    👤 {{name}}
  </text>
  
  <text x="500" y="510" 
        font-family="Arial, Microsoft YaHei, sans-serif" 
        font-size="28" 
        fill="#616161">
    🆔 {{idNumber}}
  </text>
  
  <!-- 票号 -->
  <text x="80" y="570" 
        font-family="Arial, Microsoft YaHei, sans-serif" 
        font-size="18" 
        fill="#9e9e9e">
    Ticket No: {{ticketNumber}}
  </text>
  
  <!-- 装饰元素 -->
  <circle cx="920" cy="100" r="40" fill="#667eea" opacity="0.08"/>
  <circle cx="880" cy="140" r="25" fill="#764ba2" opacity="0.08"/>
</svg>
