name: Deploy to COS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Install COSCLI
        # Pull from the official tencentyun/coscli GitHub release so the sha256
        # digest lives next to an immutable tag instead of a CDN URL that
        # Tencent rotates without notice.
        env:
          COSCLI_VERSION: v1.0.9
        run: |
          BINARY="coscli-${COSCLI_VERSION}-linux-amd64"
          curl -fsSLo coscli "https://github.com/tencentyun/coscli/releases/download/${COSCLI_VERSION}/${BINARY}"
          EXPECTED=$(curl -fsSL "https://api.github.com/repos/tencentyun/coscli/releases/tags/${COSCLI_VERSION}" \
            | jq -r --arg name "$BINARY" '.assets[] | select(.name == $name) | .digest | sub("^sha256:"; "")')
          [ -n "$EXPECTED" ] || { echo "::error::unable to fetch coscli digest for ${BINARY}"; exit 1; }
          echo "${EXPECTED}  coscli" | sha256sum --check --strict
          chmod +x coscli

      - name: Deploy
        env:
          TENCENT_CLOUD_SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
          TENCENT_CLOUD_SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
        run: |
          ./coscli config set --secret_id "$TENCENT_CLOUD_SECRET_ID" --secret_key "$TENCENT_CLOUD_SECRET_KEY"
          ./coscli config add --bucket site-web-tools-1301539318 --region ap-beijing --endpoint cos.accelerate.myqcloud.com --alias site
          ./coscli sync dist/ cos://site/ --recursive --delete --force

      - name: Auto-purge EdgeOne HTML cache
        env:
          TENCENT_CLOUD_SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
          TENCENT_CLOUD_SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
          TARGETS: "https://tools.imjz.net/ https://tools.imjz.net/index.html"
          EDGEONE_ZONE_NAME: "tools.imjz.net"
        run: |
          set -euo pipefail
          echo "==> resolving ZoneId via DescribeZones"
          list_out=$(bash scripts/edgeone-purge.sh --list-zones)
          echo "$list_out"
          ZONE_ID=$(printf '%s\n' "$list_out" | awk -F'\t' -v z="$EDGEONE_ZONE_NAME" '$2 == z {print $1; exit}')
          if [[ -z "$ZONE_ID" ]]; then
            echo "::error::no zone matched ZoneName=$EDGEONE_ZONE_NAME" >&2
            exit 1
          fi
          echo "==> ZoneId resolved: $ZONE_ID"
          echo "==> purging"
          ZONE_ID="$ZONE_ID" bash scripts/edgeone-purge.sh
